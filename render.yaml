# Inference Blueprint. Render has no GPU — train on RunPod, serve here.
# The decoder Transformer is ~21M params (~80 MB weights). CPU is enough.
# Free (512 MB) will OOM on PyTorch. 4c-8g is extra headroom on a paid plan.
#
# Dashboard: New → Blueprint → this repo. Region is fixed at first deploy.
# prelude.pt / etude.pt are REMI snapshots (~97 MiB, under GitHub's 100 MiB limit).
services:
  - type: web
    name: notelm
    runtime: docker
    plan: 4c-8g
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NOTELM_PRELOAD
        value: "1"
      - key: SITE_URL
        value: https://notelm.onrender.com
      - key: NEXT_PUBLIC_SITE_URL
        value: https://notelm.onrender.com
      - key: OMP_NUM_THREADS
        value: "4"
      - key: MKL_NUM_THREADS
        value: "4"
      - key: TORCH_NUM_THREADS
        value: "4"
